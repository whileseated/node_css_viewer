            const dataToExport = useFullData ? allData : (showCheckedRows ? currentData : currentData);

            dataToExport.forEach((row, index) => {
                let rowData = [];

                // Add rank if enabled
                if (showRankColumn) {
                    rowData.push(index + 1);
                }

                // Add checked state if checkboxes enabled
                if (showCheckboxColumn) {
                    rowData.push(checkedRows.has(row.ID) ? 'TRUE' : 'FALSE');
                }

                // Add all other columns
                currentHeaders.forEach(header => {
                    const value = row[header];
                    // Escape quotes and wrap in quotes if contains comma, quote, or newline
                    const stringValue = value !== null && value !== undefined ? String(value) : '';
                    const escapedValue = stringValue.replace(/"/g, '""');
                    rowData.push(`"${escapedValue}"`);
                });

                csvContent += rowData.join(',') + '\n';
            });

            return csvContent;
        }

        function downloadCSV() {
            const csvContent = generateCSVContent();

            // Create download link
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            // Generate filename with timestamp
            const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
            const filename = `csv_export_${timestamp}.csv`;

            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Tab switching functionality
        function switchTab(tab) {
            if (tab === 'upload') {
                document.getElementById('savedTab').classList.remove('active');
                document.getElementById('uploadSection').style.display = 'block';
                document.getElementById('savedFilesSection').style.display = 'none';
                // Show action buttons if we have data loaded
                if (currentData.length > 0) {
                    document.getElementById('deleteBtn').style.display = 'block';
                    document.getElementById('addRowBtn').style.display = 'block';
                    document.getElementById('addColumnBtn').style.display = 'block';
                }
                // Show add header button if using default headers
                if (!hasCustomHeaders && currentData.length > 0) {
                    document.getElementById('addHeaderBtn').style.display = 'block';
                }

                // (filename is already set by processFile, so no need to change it here)
            } else if (tab === 'saved') {
                // Check if saved tab is already active - if so, just collapse the list
                const savedTabActive = document.getElementById('savedTab').classList.contains('active');

                    document.getElementById('savedFilesSection').style.display = 'none';

                    document.getElementById('uploadSection').style.display = 'none';
                    document.getElementById('savedFilesSection').style.display = 'block';

                    document.getElementById('deleteBtn').style.display = 'none';
                    document.getElementById('addRowBtn').style.display = 'none';
                    document.getElementById('addColumnBtn').style.display = 'none';
                    document.getElementById('addHeaderBtn').style.display = 'none';

                    loadSavedFiles();

        // Saved files management
        function updateSavedFilesSearchStatus(message, isError = false) {
            const status = document.getElementById('savedFilesSearchStatus');
            if (!status) return;

            status.textContent = message || '';
            status.style.display = message ? 'block' : 'none';
            status.classList.toggle('error', Boolean(isError));
        }

        function updateSavedFilesSearchControls() {
            const clearButton = document.getElementById('savedFilesSearchClear');
            if (!clearButton) return;

            clearButton.style.display = savedFilesSearchQuery ? 'inline-flex' : 'none';
        }

        function handleSavedFilesSearch() {
            const input = document.getElementById('savedFilesSearchInput');
            if (!input) return;

            const query = input.value.trim();
            savedFilesSearchQuery = query;
            updateSavedFilesSearchControls();

            if (savedFilesSearchTimeout) {
                clearTimeout(savedFilesSearchTimeout);
            }

            if (!query) {
                savedFilesSearchResults = null;
                savedFilesSearchToken += 1;
                updateSavedFilesSearchStatus('');
                renderSavedFilesTable(getSortedSavedFiles(savedFilesData));
                return;
            }

            updateSavedFilesSearchStatus('Searching...');
            savedFilesSearchTimeout = setTimeout(() => {
                searchSavedFiles(query);
            }, 300);
        }

        function clearSavedFilesSearch() {
            const input = document.getElementById('savedFilesSearchInput');
            if (input) {
                input.value = '';
            }

            savedFilesSearchQuery = '';
            savedFilesSearchResults = null;
            savedFilesSearchToken += 1;

            if (savedFilesSearchTimeout) {
                clearTimeout(savedFilesSearchTimeout);
            }

            updateSavedFilesSearchControls();
            updateSavedFilesSearchStatus('');
            renderSavedFilesTable(getSortedSavedFiles(savedFilesData));
        }

        async function searchSavedFiles(query) {
            const token = ++savedFilesSearchToken;
            const trimmedQuery = query.trim();

            if (!trimmedQuery) {
                updateSavedFilesSearchStatus('');
                return;
            }

            try {
                const response = await fetch(`api/saved-files/search?query=${encodeURIComponent(trimmedQuery)}`);
                const data = await response.json();

                if (token !== savedFilesSearchToken) {
                    return;
                }

                if (!data.success) {
                    savedFilesSearchResults = [];
                    updateSavedFilesSearchStatus('Search failed. Try again.', true);
                    renderSavedFilesTable([]);
                    return;
                }

                savedFilesSearchResults = data.files || [];
                const count = savedFilesSearchResults.length;
                const plural = count === 1 ? 'file' : 'files';
                updateSavedFilesSearchStatus(`${count} ${plural} match "${trimmedQuery}"`);
                renderSavedFilesTable(getSortedSavedFiles(savedFilesSearchResults));
            } catch (error) {
                console.error('Error searching saved files:', error);
                if (token !== savedFilesSearchToken) {
                    return;
                }

                savedFilesSearchResults = [];
                updateSavedFilesSearchStatus('Search failed. Try again.', true);
                renderSavedFilesTable([]);
            }
        }

        function getActiveSavedFiles() {
            if (savedFilesSearchQuery) {
                return savedFilesSearchResults || [];
            }

            return savedFilesData;
        }

        async function loadSavedFiles() {
            const loadingIndicator = document.getElementById('savedFilesLoading');
            const filesList = document.getElementById('savedFilesList');

            loadingIndicator.style.display = 'block';
            filesList.innerHTML = '';

            try {
                const response = await fetch('api/saved-files');
                const data = await response.json();

                loadingIndicator.style.display = 'none';

                if (!data.success) {
                    filesList.innerHTML = '<div class="empty-state">Error loading files</div>';
                    return;
                }

                savedFilesData = data.files || [];

                if (savedFilesSearchQuery) {
                    updateSavedFilesSearchControls();
                    if (savedFilesData.length === 0) {
                        savedFilesSearchResults = [];
                        updateSavedFilesSearchStatus(`0 files match "${savedFilesSearchQuery}"`);
                        renderSavedFilesTable([]);
                        return;
                    }

                    await searchSavedFiles(savedFilesSearchQuery);
                    return;
                }

                if (savedFilesData.length === 0) {
                    filesList.innerHTML = '<div class="empty-state">No saved files yet. Upload and save a CSV to get started.</div>';
                    return;
                }

                renderSavedFilesTable(getSortedSavedFiles());
            } catch (error) {
                console.error('Error loading saved files:', error);
                loadingIndicator.style.display = 'none';
                filesList.innerHTML = '<div class="empty-state">Error loading files</div>';
            }
        }

        function renderSavedFilesTable(files) {
            const filesList = document.getElementById('savedFilesList');

            if (!files || files.length === 0) {
                if (savedFilesSearchQuery) {
                    filesList.innerHTML = `<div class="empty-state">No saved files contain "${escapeHtml(savedFilesSearchQuery)}".</div>`;
                } else {
                    filesList.innerHTML = '<div class="empty-state">No saved files yet. Upload and save a CSV to get started.</div>';
                }
                return;
            }

            const showMatchColumn = Boolean(savedFilesSearchQuery);
            const sortIndicator = (column) => {
                const isActive = savedFilesSort.column === column;
                const arrow = savedFilesSort.ascending ? '&#9650;' : '&#9660;';
                const visibilityClass = isActive ? 'active' : 'inactive';
                return `<span class="sort-indicator ${visibilityClass}">${isActive ? arrow : '&#9650;'}</span>`;
            };

            let tableHTML = `
                <table class="saved-files-table">
                    <thead>
                        <tr>
                            <th class="sortable" onclick="sortSavedFiles('filename')">Filename ${sortIndicator('filename')}</th>
                            <th class="sortable" onclick="sortSavedFiles('size')">Size ${sortIndicator('size')}</th>
                            <th class="sortable" onclick="sortSavedFiles('lastModified')">Last Modified ${sortIndicator('lastModified')}</th>
                            ${showMatchColumn ? '<th>Matches</th>' : ''}
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            files.forEach(file => {
                const size = formatFileSize(file.size);
                const date = formatDate(file.lastModified);
                const matchCount = typeof file.matchCount === 'number' ? file.matchCount.toLocaleString() : '—';
                tableHTML += `
                    <tr>
                        <td class="filename-cell">
                            <span class="filename-display" id="filename-${file.filename}">${file.filename}</span>
                            <input type="text" class="filename-input" id="input-${file.filename}"
                                   value="${file.filename}" style="display: none;">
                        </td>
                        <td>${size}</td>
                        <td>${date}</td>
                        ${showMatchColumn ? `<td class="saved-files-match-count">${matchCount}</td>` : ''}
                        <td>
                            <div class="file-actions">
                                <button class="file-action-btn" onclick="loadSavedFile('${file.filename}')">Load</button>
                                <button class="file-action-btn" onclick="startRename('${file.filename}')">Rename</button>
                                <button class="file-action-btn delete" onclick="deleteSavedFile('${file.filename}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            filesList.innerHTML = tableHTML;
        }

        function getSortedSavedFiles(filesToSort = savedFilesData) {
            const files = [...filesToSort];
            const { column, ascending } = savedFilesSort;

            files.sort((a, b) => {
                let result = 0;

                if (column === 'filename') {
                    result = a.filename.localeCompare(b.filename);
                } else if (column === 'size') {
                    result = (a.size || 0) - (b.size || 0);
                } else if (column === 'lastModified') {
                    result = new Date(a.lastModified) - new Date(b.lastModified);
                }

                return ascending ? result : -result;
            });

            return files;
        }

        function sortSavedFiles(column) {
            const files = getActiveSavedFiles();
            if (!files || files.length === 0) {
                return;
            }

            if (savedFilesSort.column === column) {
                savedFilesSort.ascending = !savedFilesSort.ascending;
            } else {
                savedFilesSort = {
                    column,
                    ascending: column === 'lastModified' ? false : true
                };
            }

            renderSavedFilesTable(getSortedSavedFiles(files));
        }

        async function loadSavedFile(filename) {
            try {
                const response = await fetch(`api/file/${encodeURIComponent(filename)}`);
                if (!response.ok) {
                    throw new Error('Failed to load file');
                }

                const blob = await response.blob();
                const file = new File([blob], filename, { type: 'text/csv' });

                // Reset header state when loading a saved file
                hasCustomHeaders = false;
                rawFileData = [];

                // Track which saved file is loaded for auto-save
                currentSavedFilename = filename;

                // Switch to upload tab and process the file
                switchTab('upload');
                processFile(file, filename);

                // Load notes for this file
                await loadNotes(filename);
            } catch (error) {
                console.error('Error loading file:', error);
                alert('Failed to load file: ' + error.message);
            }
        }

        function startRename(filename) {
            const displaySpan = document.getElementById(`filename-${filename}`);
            const inputField = document.getElementById(`input-${filename}`);

            displaySpan.style.display = 'none';
            inputField.style.display = 'inline-block';
            inputField.focus();
            inputField.select();

            // Handle Enter key
            inputField.onkeydown = async (e) => {
                if (e.key === 'Enter') {
                    await finishRename(filename, inputField.value);
                } else if (e.key === 'Escape') {
                    cancelRename(filename);
                }
            };

            // Handle blur (clicking outside)
            inputField.onblur = async () => {
                if (inputField.value !== filename) {
                    await finishRename(filename, inputField.value);
                } else {
                    cancelRename(filename);
                }
            };
        }

        async function finishRename(oldFilename, newFilename) {
            if (newFilename === oldFilename) {
                cancelRename(oldFilename);
                return;
            }

            if (!newFilename || newFilename.trim() === '') {
                alert('Filename cannot be empty');
                cancelRename(oldFilename);
                return;
            }

            try {
                const response = await fetch(`api/rename/${encodeURIComponent(oldFilename)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ newFilename: newFilename })
                });

                const data = await response.json();

                if (!data.success) {
                    alert('Failed to rename file: ' + data.error);
                    cancelRename(oldFilename);
                    return;
                }

                // Reload the files list
                loadSavedFiles();
            } catch (error) {
                console.error('Error renaming file:', error);
                alert('Failed to rename file: ' + error.message);
                cancelRename(oldFilename);
            }
        }

        function cancelRename(filename) {
            const displaySpan = document.getElementById(`filename-${filename}`);
            const inputField = document.getElementById(`input-${filename}`);

            displaySpan.style.display = 'inline';
            inputField.style.display = 'none';
        }

        async function deleteSavedFile(filename) {
            if (!confirm(`Are you sure you want to delete "${filename}"? This cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`api/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (!data.success) {
                    alert('Failed to delete file: ' + data.error);
                    return;
                }

                // Reload the files list
                loadSavedFiles();
            } catch (error) {
                console.error('Error deleting file:', error);
                alert('Failed to delete file: ' + error.message);
            }
        }

        // Export dialog functionality
        function showExportDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'export-dialog-overlay';
            overlay.id = 'exportOverlay';

            const dialog = document.createElement('div');
            dialog.className = 'export-dialog';
            dialog.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold;">Export CSV</div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                        <input type="radio" name="exportType" value="download" checked style="margin-right: 5px;">
                        Download to computer
                    </label>
                    <label style="display: block; cursor: pointer;">
                        <input type="radio" name="exportType" value="save" style="margin-right: 5px;">
                        Save to server
                    </label>
                </div>
                <div class="export-dialog-buttons">
                    <button class="file-action-btn" onclick="closeExportDialog()">Cancel</button>
                    <button class="file-action-btn" onclick="handleExport()" style="background: #e8eaf6; font-weight: bold;">Export</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(dialog);

            overlay.onclick = closeExportDialog;
        }

        function closeExportDialog() {
            const overlay = document.getElementById('exportOverlay');
            const dialogs = document.querySelectorAll('.export-dialog');

            if (overlay) overlay.remove();
            dialogs.forEach(d => d.remove());
        }

        async function handleExport() {
            const exportType = document.querySelector('input[name="exportType"]:checked').value;

            closeExportDialog();

            if (exportType === 'download') {
                downloadCSV();
            } else if (exportType === 'save') {
                await saveToServer();
            }
        }

        async function saveCSV() {
            if (!currentSavedFilename) {
                alert('No saved file is currently loaded');
                return;
            }

            try {
                // Generate CSV content - use allData to save complete dataset
                const csvContent = generateCSVContent(true);

                // Send update to server
                const response = await fetch(`api/update/${encodeURIComponent(currentSavedFilename)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: csvContent })
                });

                const data = await response.json();

                if (data.success) {
                    // Show brief success message
                    const saveLink = document.getElementById('saveLink');
                    const originalText = saveLink.textContent;
                    saveLink.textContent = 'Saved!';
                    setTimeout(() => {
                        saveLink.textContent = originalText;
                    }, 1500);
                } else {
                    alert('Failed to save file: ' + data.error);
                }
            } catch (error) {
                console.error('Error saving file:', error);
                alert('Failed to save file: ' + error.message);
            }
        }

        async function saveToServer() {
            let filename = prompt('Enter a filename for the saved CSV:', `csv_export_${new Date().toISOString().slice(0, 10)}`);

            if (!filename) {
                return; // User cancelled
            }

            // Automatically add .csv extension if not present
            if (!filename.toLowerCase().endsWith('.csv')) {
                filename = filename + '.csv';
            }

            const csvContent = generateCSVContent();
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const file = new File([blob], filename, { type: 'text/csv' });

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!data.success) {
                    alert('Failed to save file: ' + data.error);
                    return;
                }

                alert('File saved successfully!');

                // If user is on saved files tab, reload the list
                if (document.getElementById('savedTab').classList.contains('active')) {
                    loadSavedFiles();
                }
            } catch (error) {
                console.error('Error saving file:', error);
                alert('Failed to save file: ' + error.message);
            }
        }

        // Helper functions
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) {
                const hours = Math.floor(diff / (1000 * 60 * 60));
                if (hours === 0) {
                    const minutes = Math.floor(diff / (1000 * 60));
                    return minutes === 0 ? 'Just now' : `${minutes}m ago`;
                }
                return `${hours}h ago`;
            } else if (days === 1) {
                return 'Yesterday';
            } else if (days < 7) {
                return `${days}d ago`;
            } else {
                return date.toLocaleDateString();
            }
        }

        // Delete functionality
        function showDeleteDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'export-dialog-overlay';
            overlay.id = 'deleteDialogOverlay';

            const dialog = document.createElement('div');
            dialog.className = 'export-dialog';

            // Build options based on what's available
            let optionsHTML = '';

            // Selected rows option
            if (selectedRowIDs.size > 0) {
                const selectedCount = selectedRowIDs.size;
                const rowLabel = selectedCount === 1 ? 'row' : 'rows';
                optionsHTML += `
                    <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                        <input type="radio" name="deleteType" value="selectedRow" checked style="margin-right: 5px;">
                        Delete ${selectedCount} selected ${rowLabel}
                    </label>
                `;
            }

            // Checked rows option
            optionsHTML += `
                <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                    <input type="radio" name="deleteType" value="rows" ${selectedRowIDs.size === 0 ? 'checked' : ''} style="margin-right: 5px;">
                    Delete checked rows
                </label>
            `;

            // Column option
            optionsHTML += `
                <label style="display: block; cursor: pointer;">
                    <input type="radio" name="deleteType" value="columns" style="margin-right: 5px;">
                    Delete a column
                </label>
            `;

            dialog.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold;">Delete Rows or Columns</div>
                <div style="margin-bottom: 10px;">
                    ${optionsHTML}
                </div>
                <div class="export-dialog-buttons">
                    <button class="file-action-btn" onclick="closeDeleteDialog()">Cancel</button>
                    <button class="file-action-btn" onclick="handleDelete()" style="background: #ffebee; font-weight: bold;">Delete</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(dialog);

            overlay.onclick = closeDeleteDialog;
        }

        function closeDeleteDialog() {
            const overlay = document.getElementById('deleteDialogOverlay');
            const dialogs = document.querySelectorAll('.export-dialog');

            if (overlay) overlay.remove();
            dialogs.forEach(d => {
                if (d.textContent.includes('Delete Rows or Columns') || d.textContent.includes('Select Column to Delete')) {
                    d.remove();
                }
            });
        }

        function handleDelete() {
            const deleteType = document.querySelector('input[name="deleteType"]:checked').value;

            closeDeleteDialog();

            if (deleteType === 'selectedRow') {
                deleteSelectedRow();
            } else if (deleteType === 'rows') {
                deleteCheckedRows();
            } else if (deleteType === 'columns') {
                showColumnSelectionDialog();
            }
        }

        function deleteSelectedRow() {
            if (selectedRowIDs.size === 0) {
                alert('No rows are selected');
                return;
            }

            const count = selectedRowIDs.size;
            const rowLabel = count === 1 ? 'row' : 'rows';
            if (!confirm(`Are you sure you want to delete ${count} selected ${rowLabel}? This cannot be undone.`)) {
                return;
            }

            // Remove selected rows from both currentData and allData
            currentData = currentData.filter(row => !selectedRowIDs.has(row.ID));
            allData = allData.filter(row => !selectedRowIDs.has(row.ID));

            // Also remove from unfilteredData if it exists
            if (unfilteredData.length > 0) {
                unfilteredData = unfilteredData.filter(row => !selectedRowIDs.has(row.ID));
            }

            // Remove from checked rows if any were checked
            selectedRowIDs.forEach(id => {
                checkedRows.delete(id);
            });

            // Clear selection
            selectedRowIDs.clear();
            lastSelectedRowIndex = null;

            // Re-display data
            displayData(currentData);
            updateUIVisibility();
            markAsAdjusted();
            triggerAutoSave();
        }

        function showColumnSelectionDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'export-dialog-overlay';
            overlay.id = 'deleteDialogOverlay';

            const dialog = document.createElement('div');
            dialog.className = 'export-dialog';

            let columnsHTML = '';
            currentHeaders.forEach((header, index) => {
                columnsHTML += `
                    <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                        <input type="radio" name="columnToDelete" value="${index}" ${index === 0 ? 'checked' : ''} style="margin-right: 5px;">
                        ${header}
                    </label>
                `;
            });

            dialog.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold;">Select Column to Delete</div>
                <div style="margin-bottom: 10px; max-height: 300px; overflow-y: auto;">
                    ${columnsHTML}
                </div>
                <div class="export-dialog-buttons">
                    <button class="file-action-btn" onclick="closeDeleteDialog()">Cancel</button>
                    <button class="file-action-btn" onclick="deleteSelectedColumn()" style="background: #ffebee; font-weight: bold;">Delete Column</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(dialog);

            overlay.onclick = closeDeleteDialog;
        }

        function deleteSelectedColumn() {
            const selectedIndex = document.querySelector('input[name="columnToDelete"]:checked').value;
            const columnIndex = parseInt(selectedIndex);
            const columnName = currentHeaders[columnIndex];

            if (!confirm(`Are you sure you want to delete the column "${columnName}"? This cannot be undone.`)) {
                closeDeleteDialog();
                return;
            }

            closeDeleteDialog();

            // Remove the column from headers
            currentHeaders.splice(columnIndex, 1);

            // Remove the column from all data
            currentData = currentData.map(row => {
                const newRow = { ...row };
                delete newRow[columnName];
                return newRow;
            });

            allData = allData.map(row => {
                const newRow = { ...row };
                delete newRow[columnName];
                return newRow;
            });

            // Remove from unfiltered data if it exists
            if (unfilteredData.length > 0) {
                unfilteredData = unfilteredData.map(row => {
                    const newRow = { ...row };
                    delete newRow[columnName];
                    return newRow;
                });
            }

            // Remove from column widths
            if (columnWidths[columnName]) {
                delete columnWidths[columnName];
            }

            // Remove from column types
            if (columnTypes[columnName]) {
                delete columnTypes[columnName];
            }

            // Mark as adjusted and trigger auto-save
            markAsAdjusted();
            displayData(currentData);
            triggerAutoSave();
        }

        // Add header functionality
        function showAddHeaderDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'export-dialog-overlay';
            overlay.id = 'headerDialogOverlay';

            const firstRow = rawFileData[0] || [];
            const secondRow = rawFileData.length > 1 ? rawFileData[1] : null;
            const firstRowValues = firstRow.join(', ');
            const secondRowValues = secondRow ? secondRow.join(', ') : '';
            const keepFirstRowChecked = !hasCustomHeaders;

            const dialog = document.createElement('div');
            dialog.className = 'export-dialog';
            dialog.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold;">Change Headers</div>
                <div style="margin-bottom: 10px; font-size: 11px; color: #666;">
                    Current headers: ${firstRowValues.substring(0, 80)}${firstRowValues.length > 80 ? '...' : ''}
                </div>
                ${secondRow ? `<div style="margin-bottom: 10px; font-size: 11px; color: #666;">
                    First data row: ${secondRowValues.substring(0, 80)}${secondRowValues.length > 80 ? '...' : ''}
                </div>` : ''}
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                        <input type="radio" name="headerType" value="second-row" ${secondRow ? 'checked' : ''} ${!secondRow ? 'disabled' : ''} style="margin-right: 5px;">
                        Use next row as headers (shift data up)
                    </label>
                    <label style="display: block; cursor: pointer;">
                        <input type="radio" name="headerType" value="custom" ${!secondRow ? 'checked' : ''} style="margin-right: 5px;">
                        Enter custom headers
                    </label>
                    <label style="display: block; margin-left: 20px; font-size: 11px; color: #666; cursor: pointer;">
                        <input type="checkbox" id="keepFirstRowAsData" ${keepFirstRowChecked ? 'checked' : ''} style="margin-right: 5px;">
                        Keep existing first row as data (insert headers above)
                    </label>
                </div>
                <div class="export-dialog-buttons">
                    <button class="file-action-btn" onclick="closeHeaderDialog()">Cancel</button>
                    <button class="file-action-btn" onclick="applyHeaders()" style="background: #e8eaf6; font-weight: bold;">Apply</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(dialog);

            overlay.onclick = closeHeaderDialog;
        }

        function closeHeaderDialog() {
            const overlay = document.getElementById('headerDialogOverlay');
            const dialogs = document.querySelectorAll('.export-dialog');

            if (overlay) overlay.remove();
            dialogs.forEach(d => {
                // Only remove header dialogs, not export dialogs
                if (d.textContent.includes('Change Headers')) {
                    d.remove();
                }
            });
        }

        function applyHeaders() {
            const headerTypeInput = document.querySelector('input[name="headerType"]:checked');
            if (!headerTypeInput) {
                closeHeaderDialog();
                return;
            }

            const headerType = headerTypeInput.value;
            const keepFirstRowAsData = headerType === 'custom'
                && document.getElementById('keepFirstRowAsData')?.checked;

            closeHeaderDialog();

            if (headerType === 'second-row') {
                // Use second row as headers (shift data up one row)
                currentHeaders = rawFileData[1];
                currentData = rawFileData.slice(2);
            } else if (headerType === 'custom') {
                // Prompt for custom headers - use current headers length (already has Checked/Rank stripped)
                const numberOfColumns = currentHeaders.length;
                const newHeadersPrompt = `Enter ${numberOfColumns} column headers separated by commas:`;
                const newHeadersInput = prompt(newHeadersPrompt);

                if (newHeadersInput) {
                    const newHeaders = newHeadersInput.split(',').map(h => h.trim());
                    if (newHeaders.length === numberOfColumns) {
                        // Convert current data objects back to arrays using old headers order
                        const oldHeaders = [...currentHeaders]; // Save old headers
                        const dataRows = currentData.map(row => {
                            if (Array.isArray(row)) {
                                return row;
                            }
                            return oldHeaders.map(header => row[header]);
                        });

                        if (keepFirstRowAsData) {
                            dataRows.unshift(oldHeaders);
                        }

                        currentHeaders = newHeaders;
                        currentData = dataRows;
                    } else {
                        alert(`Please provide exactly ${numberOfColumns} headers. You provided ${newHeaders.length}.`);
                        return;
                    }
                } else {
                    return; // User cancelled
                }
            }

            // Check if headers include "Checked" or "Rank" columns (from raw data)
            // These should be UI state, not data columns
            const checkedColumnIndex = currentHeaders.indexOf('Checked');
            const rankColumnIndex = currentHeaders.indexOf('Rank');

            // Strip out Checked/Rank columns if present (when using second-row option)
            if (checkedColumnIndex !== -1 || rankColumnIndex !== -1) {
                // Remove from headers
                currentHeaders = currentHeaders.filter(h => h !== 'Checked' && h !== 'Rank');

                // Remove from data
                currentData = currentData.map(row => {
                    if (Array.isArray(row)) {
                        // If row is still array (from rawFileData), filter by index
                        return row.filter((_, i) => i !== checkedColumnIndex && i !== rankColumnIndex);
                    }
                    return row; // Already processed
                });
            }

            // Remap data with new headers
            currentData = currentData.map((row, index) => {
                const mappedRow = { ID: index + 1 };
                currentHeaders.forEach((header, i) => {
                    mappedRow[header] = row[i] !== undefined ? row[i] : '';
                });
                return mappedRow;
            });

            allData = [...currentData];
            hasCustomHeaders = true;

            // Hide the add header button
            document.getElementById('addHeaderBtn').style.display = 'none';

            // Redisplay the data with new headers
            displayData(currentData);
        }

        // Add new row functionality
        function addNewRow() {
            if (!currentHeaders || currentHeaders.length === 0) {
                alert('No data loaded');
                return;
            }

            // Find the highest ID in allData
            let maxID = 0;
            allData.forEach(row => {
                if (row.ID > maxID) {
                    maxID = row.ID;
                }
            });

            // Create new empty row with next ID
            const newRow = { ID: maxID + 1 };
            currentHeaders.forEach(header => {
                // Set default value based on column type
                if (columnTypes[header] === 'checkbox') {
                    newRow[header] = 'FALSE';
                } else if (columnTypes[header] === 'number') {
                    newRow[header] = '0';
                } else {
                    newRow[header] = '';
                }
            });

            // Add to both current and all data
            currentData.push(newRow);
            allData.push(newRow);

            // If we have unfiltered data, add there too
            if (unfilteredData.length > 0) {
                unfilteredData.push(newRow);
            }

            // Mark as adjusted and refresh display
            markAsAdjusted();
            displayData(currentData);
            triggerAutoSave();
        }

        // Add new column functionality
        function showAddColumnDialog() {
            const overlay = document.createElement('div');
            overlay.className = 'export-dialog-overlay';
            overlay.id = 'addColumnOverlay';

            const dialog = document.createElement('div');
            dialog.className = 'export-dialog';
            dialog.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold;">Add New Column</div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Column Name:</label>
                    <input type="text" id="newColumnName" class="form-control" placeholder="Enter column name" style="margin-bottom: 10px;" />

                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Column Type:</label>
                    <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                        <input type="radio" name="columnType" value="text" checked style="margin-right: 5px;">
                        Text
                    </label>
                    <label style="display: block; margin-bottom: 5px; cursor: pointer;">
                        <input type="radio" name="columnType" value="number" style="margin-right: 5px;">
                        Number
                    </label>
                    <label style="display: block; cursor: pointer;">
                        <input type="radio" name="columnType" value="checkbox" style="margin-right: 5px;">
                        Checkbox
                    </label>
                </div>
                <div class="export-dialog-buttons">
                    <button class="file-action-btn" onclick="closeAddColumnDialog()">Cancel</button>
                    <button class="file-action-btn" onclick="addColumn()" style="background: #e3f2fd; font-weight: bold;">Add Column</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(dialog);

            overlay.onclick = closeAddColumnDialog;

            // Focus the input field
            setTimeout(() => {
                const input = document.getElementById('newColumnName');
                if (input) {
                    input.focus();
                }
            }, 100);

            // Allow Enter key to submit
            const input = document.getElementById('newColumnName');
            if (input) {
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addColumn();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        closeAddColumnDialog();
                    }
                };
            }
        }

        function closeAddColumnDialog() {
            const overlay = document.getElementById('addColumnOverlay');
            const dialogs = document.querySelectorAll('.export-dialog');

            if (overlay) overlay.remove();
            dialogs.forEach(d => {
                if (d.textContent.includes('Add New Column')) {
                    d.remove();
                }
            });
        }

        function addColumn() {
            const columnName = document.getElementById('newColumnName').value.trim();
            const columnType = document.querySelector('input[name="columnType"]:checked').value;

            if (!columnName) {
                alert('Please enter a column name');
                return;
            }

            // Check if column name already exists
            if (currentHeaders.includes(columnName)) {
                alert('A column with that name already exists. Please choose another name.');
                return;
            }

            closeAddColumnDialog();

            // Add new header
            currentHeaders.push(columnName);

            // Store the column type
            columnTypes[columnName] = columnType;

            // Determine default value based on type
            let defaultValue = '';
            if (columnType === 'number') {
                defaultValue = '0';
            } else if (columnType === 'checkbox') {
                defaultValue = 'FALSE';
            }

            // Add the new column to all rows in currentData
            currentData = currentData.map(row => {
                return {
                    ...row,
                    [columnName]: defaultValue
                };
            });

            // Add the new column to all rows in allData
            allData = allData.map(row => {
                return {
                    ...row,
                    [columnName]: defaultValue
                };
            });

            // Add to unfiltered data if it exists
            if (unfilteredData.length > 0) {
                unfilteredData = unfilteredData.map(row => {
                    return {
                        ...row,
                        [columnName]: defaultValue
                    };
                });
            }

            // Mark as adjusted and refresh display
            hasCustomHeaders = true;
            markAsAdjusted();
            displayData(currentData);
            triggerAutoSave();
        }
    </script>
</body>
