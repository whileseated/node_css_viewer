<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<title>CSV/TSV Viewer</title>
</head>
<body>
    <div class="options-container" id="optionsContainer" style="display: none;">
        <span id="rowCount" class="row-count-badge"></span>
        <span id="autoSaveIndicator" class="auto-save-indicator" style="display: none;"></span>
        <a href="#" id="showAllLink" onclick="showAllRows()" style="display: none;">Show All</a>
        <input type="text" id="filterInput" class="filter-input" placeholder="Filter rows..." oninput="filterRows()" />
        <a href="#" id="toggleRankColumnLink" onclick="toggleRankColumn()">Rank</a>
        <a href="#" id="toggleDragHandleLink" onclick="toggleDragHandle()">Drag Handle</a>
        <a href="#" id="saveLink" onclick="saveCSV()" style="display: none;">Save</a>
        <a href="#" id="exportCSVLink" onclick="exportCSV()" style="display: none;">Export</a>
    </div>

    <div class="bulk-actions-container" id="bulkActionsContainer" style="display: none;">
        <a href="#" id="toggleCheckmarkColumnLink" onclick="toggleCheckmarkColumn()">Checkmark</a>
        <a href="#" id="showCheckedRowsLink" onclick="toggleCheckedRows()" style="display: none;">Show Checks</a>
        <a href="#" id="checkAllNoneLink" onclick="toggleCheckAllNone()" style="display: none;">Check All</a>
        <a href="#" id="deleteCheckedLink" onclick="deleteCheckedRows()" style="display: none;">Delete Checked</a>
    </div>

    <div class="container mt-3">
        <!-- Tab Navigation -->
        <div class="tab-container">
            <button class="delete-button" id="deleteBtn" onclick="showDeleteDialog()" style="display: none;" title="Delete rows or columns">−</button>
            <button class="add-row-button" id="addRowBtn" onclick="addNewRow()" style="display: none;" title="Add new row">+ Row</button>
            <button class="add-column-button" id="addColumnBtn" onclick="showAddColumnDialog()" style="display: none;" title="Add new column">+ Col</button>
            <button class="add-header-button" id="addHeaderBtn" onclick="showAddHeaderDialog()" style="display: none;" title="Change headers">+/- head</button>
            <span class="current-filename" id="currentFilename"></span>
            <button class="tab-button" id="savedTab" onclick="switchTab('saved')">Saved Files</button>
        </div>

        <!-- Upload Section -->
        <div id="uploadSection" class="upload-section">
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-icon">⇪</div>
                <div class="drop-zone-text">Drop CSV or TSV file here</div>
                <div class="drop-zone-or">or</div>
                <label for="csvFile" class="file-button">Choose File</label>
                <input type="file" id="csvFile" class="file-input" accept=".csv,.tsv,.txt" />
                <div class="drop-zone-hint">Supports .csv, .tsv, and .txt files</div>
            </div>
        </div>

        <!-- Saved Files Section -->
        <div id="savedFilesSection" class="saved-files-section" style="display: none;">
            <div class="saved-files-container">
                <div class="saved-files-toolbar">
                    <div class="saved-files-search">
                        <input type="text" id="savedFilesSearchInput" class="saved-files-search-input"
                               placeholder="Search saved file contents..." aria-label="Search saved file contents"
                               oninput="handleSavedFilesSearch()">
                        <button class="saved-files-clear-btn" id="savedFilesSearchClear" onclick="clearSavedFilesSearch()" style="display: none;">
                            Clear
                        </button>
                    </div>
                    <div class="saved-files-search-status" id="savedFilesSearchStatus" style="display: none;"></div>
                </div>
                <div id="savedFilesContent">
                    <div class="loading-indicator" id="savedFilesLoading" style="display: none;">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Loading saved files...</div>
                    </div>
                    <div id="savedFilesList"></div>
                </div>
            </div>
        </div>

        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <div class="loading-spinner"></div>
            <div class="loading-text">Processing file...</div>
            <div class="loading-details" id="loadingDetails">Parsing rows...</div>
        </div>

        <div class="table-container" id="tableContainer" style="display: none;">
            <table class="table table-striped" id="csvTable">
                <thead class="table-header"></thead>
                <tbody class="table-body"></tbody>
            </table>
        </div>

        <div class="notes-container" id="notesContainer" style="display: none;">
            <div class="notes-header">
                <label for="notesTextarea">Notes</label>
                <span id="notesAutoSaveIndicator" class="auto-save-indicator" style="display: none;"></span>
            </div>
            <textarea id="notesTextarea" class="notes-textarea" placeholder="Add notes about this CSV file..." oninput="triggerNotesAutoSave()"></textarea>
        </div>
    </div>

    <script>
        let currentData = [];
        let currentHeaders = null;
        let rawFileData = []; // Store raw file data before headers are applied
        let hasCustomHeaders = false; // Track if user has set custom headers
        let showRankColumn = false;
        let showCheckboxColumn = false;
        let showDragHandle = false;
        let checkedRows = new Set();
        let showCheckedRows = false;
        let currentSort = { column: null, ascending: true }; // Define the current sorting state
        let allData = []; // Store the complete dataset for toggling back
        let unfilteredData = []; // Store data before filter is applied
        let hasSignificantAdjustments = false; // Track if export should be available
        let lastCheckedIndex = null; // Track last checked checkbox for shift-click
        let columnWidths = {}; // Store custom column widths
        let isResizing = false;
        let currentResizeColumn = null;
        let startX = 0;
        let startWidth = 0;
        let currentFilter = ''; // Track current filter text
        let currentSavedFilename = null; // Track currently loaded saved file for auto-save
        let autoSaveTimeout = null; // Debounce timer for auto-save
        let notesAutoSaveTimeout = null; // Debounce timer for notes auto-save
        let selectedRowIDs = new Set(); // Track currently selected rows for deletion
        let lastSelectedRowIndex = null; // Track last selected row for shift-click range selection
        let currentFilename = null; // Track current filename to detect reloads
        let savedUIState = null; // Store UI state for file reloads
        let editingHeaderIndex = null; // Track which header is being edited
        let pendingHeaderName = ''; // Current input value while editing
        let originalHeaderName = null; // Preserve original header for rename operations
        let editingCell = null; // Track active inline text edit
        let savedFilesData = []; // Cache saved files for sorting
        let savedFilesSort = { column: 'lastModified', ascending: false }; // Default to newest first
        let savedFilesSearchQuery = '';
        let savedFilesSearchResults = null;
        let savedFilesSearchTimeout = null;
        let savedFilesSearchToken = 0;
        let columnTypes = {}; // Track column types (text, number, checkbox)
        let draggedHeaderIndex = null; // Track which column header is being dragged
        let isColumnDragging = false; // Track drag activity to avoid accidental clicks
        let columnDragJustEnded = false; // Prevent click after drag end

        // Save current UI state
        function saveUIState() {
            return {
                filter: currentFilter,
                sort: { ...currentSort },
                columnWidths: { ...columnWidths },
                columnTypes: { ...columnTypes },
                checkedRows: new Set(checkedRows),
                showRankColumn: showRankColumn,
                showCheckboxColumn: showCheckboxColumn,
                showDragHandle: showDragHandle,
                showCheckedRows: showCheckedRows,
                hasSignificantAdjustments: hasSignificantAdjustments,
                currentSavedFilename: currentSavedFilename,
                headers: currentHeaders ? [...currentHeaders] : null
            };
        }

        function isEmptySortValue(value) {
            if (value === null || value === undefined) return true;
            if (typeof value === 'number' && Number.isNaN(value)) return true;
            if (Array.isArray(value) && value.length === 0) return true;

            const textValue = String(value).trim();
            if (textValue === '') return true;

            const lowerValue = textValue.toLowerCase();
            if (lowerValue === '-' || lowerValue === 'null' || lowerValue === 'undefined' || lowerValue === 'nan') {
                return true;
            }
            return false;
        }

        function compareCellValues(valA, valB, ascending) {
            const isEmptyA = isEmptySortValue(valA);
            const isEmptyB = isEmptySortValue(valB);

            if (isEmptyA && isEmptyB) return 0;
            if (isEmptyA) return 1;
            if (isEmptyB) return -1;

            const numA = parseFloat(valA);
            const numB = parseFloat(valB);

            if (!isNaN(numA) && !isNaN(numB)) {
                if (numA < numB) return ascending ? -1 : 1;
                if (numA > numB) return ascending ? 1 : -1;
                return 0;
            }

            const strA = String(valA).toLowerCase();
            const strB = String(valB).toLowerCase();
            if (strA < strB) return ascending ? -1 : 1;
            if (strA > strB) return ascending ? 1 : -1;
            return 0;
        }

        // Restore UI state after file load
        function restoreUIState(state, isReload) {
            if (!state || !isReload) return;

            // Restore simple flags
            showRankColumn = state.showRankColumn;
            showCheckboxColumn = state.showCheckboxColumn;
            showDragHandle = state.showDragHandle;
            showCheckedRows = state.showCheckedRows;
            hasSignificantAdjustments = state.hasSignificantAdjustments;
            currentSavedFilename = state.currentSavedFilename;

            // Restore column widths and types if headers match
            if (state.headers && currentHeaders &&
                JSON.stringify(state.headers) === JSON.stringify(currentHeaders)) {
                columnWidths = { ...state.columnWidths };
                columnTypes = { ...state.columnTypes };

                // Restore checked rows (they use the same ID system)
                checkedRows = new Set(state.checkedRows);

                // Restore sort
                currentSort = { ...state.sort };
                if (currentSort.column) {
                    const sortFunction = (a, b) => {
                        // Special handling for "Checked" column - sort by checkbox state
                        if (currentSort.column === 'Checked') {
                            const isAChecked = checkedRows.has(a.ID);
                            const isBChecked = checkedRows.has(b.ID);

                            if (isAChecked === isBChecked) return 0;
                            if (isAChecked && !isBChecked) return currentSort.ascending ? -1 : 1;
                            if (!isAChecked && isBChecked) return currentSort.ascending ? 1 : -1;
                            return 0;
                        }

                        const valA = a[currentSort.column];
                        const valB = b[currentSort.column];

                        return compareCellValues(valA, valB, currentSort.ascending);
                    };
                    currentData.sort(sortFunction);
                    allData.sort(sortFunction);
                }

                // Restore filter
                if (state.filter) {
                    currentFilter = state.filter;
                    document.getElementById('filterInput').value = state.filter;
                    unfilteredData = [...currentData];
                    const filterText = state.filter.toLowerCase();
                    currentData = currentData.filter(row => {
                        return currentHeaders.some(header => {
                            const value = row[header];
                            if (value === null || value === undefined) return false;
                            return String(value).toLowerCase().includes(filterText);
                        });
                    });
                }

                // Update button states
                document.getElementById('toggleRankColumnLink').classList.toggle('active', showRankColumn);
                document.getElementById('toggleCheckmarkColumnLink').classList.toggle('active', showCheckboxColumn);
                document.getElementById('toggleDragHandleLink').classList.toggle('active', showDragHandle);
                document.getElementById('showCheckedRowsLink').classList.toggle('active', showCheckedRows);

                // Show bulk actions container if checkboxes were enabled
                const bulkActionsContainer = document.getElementById('bulkActionsContainer');
                if (showCheckboxColumn) {
                    bulkActionsContainer.style.display = 'flex';
                } else {
                    bulkActionsContainer.style.display = 'none';
                }

                // Apply checked rows filter if it was active
                if (showCheckedRows) {
                    currentData = allData.filter(row => checkedRows.has(row.ID));
                }
            }
        }

        // File input event listener
        document.getElementById('csvFile').addEventListener('change', uploadFile);

        // Drag and drop event listeners
        const dropZone = document.getElementById('dropZone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropZone.classList.remove('drag-over');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                const validExtensions = ['.csv', '.tsv', '.txt'];
                const isValid = validExtensions.some(ext => file.name.toLowerCase().endsWith(ext));

                if (isValid) {
                    // Clear saved filename when dropping new file (not from server)
                    if (file.name !== currentSavedFilename) {
                        currentSavedFilename = null;
                        hideNotes(); // Hide notes when loading non-saved file
                    }
                    processFile(file, file.name);
                } else {
                    alert('Please drop a CSV, TSV, or TXT file');
                }
            }
        });

        async function uploadFile() {
            const csvFile = document.getElementById('csvFile').files[0];
            if (csvFile) {
                // Clear saved filename when uploading new file (not from server)
                // But keep currentFilename for reload detection (handled in processFile)
                if (csvFile.name !== currentSavedFilename) {
                    currentSavedFilename = null;
                    hideNotes(); // Hide notes when loading non-saved file
                }
                processFile(csvFile, csvFile.name);
            }
        }

        // Auto-save functionality
        function triggerAutoSave() {
            if (!currentSavedFilename) {
                return; // Only auto-save if file was loaded from saved files
            }

            // Clear existing timeout
            if (autoSaveTimeout) {
                clearTimeout(autoSaveTimeout);
            }

            // Debounce: wait 500ms after last change before saving
            autoSaveTimeout = setTimeout(async () => {
                await performAutoSave();
            }, 500);
        }

        async function performAutoSave() {
            if (!currentSavedFilename || !currentData || currentData.length === 0) {
                return;
            }

            const indicator = document.getElementById('autoSaveIndicator');
            indicator.textContent = 'Saving...';
            indicator.style.display = 'inline-block';

            try {
                // Generate CSV content - use allData to save complete dataset, not filtered view
                const csvContent = generateCSVContent(true);

                // Send update to server
                const response = await fetch(`api/update/${encodeURIComponent(currentSavedFilename)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: csvContent })
                });

                const data = await response.json();

                if (data.success) {
                    indicator.textContent = 'Saved';
                    setTimeout(() => {
                        indicator.style.display = 'none';
                    }, 2000);
                } else {
                    indicator.textContent = 'Save failed';
                    console.error('Auto-save failed:', data.error);
                    setTimeout(() => {
                        indicator.style.display = 'none';
                    }, 3000);
                }
            } catch (error) {
                console.error('Auto-save error:', error);
                indicator.textContent = 'Save failed';
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 3000);
            }
        }

        // Notes auto-save functionality
        function triggerNotesAutoSave() {
            if (!currentSavedFilename) {
                return; // Only auto-save notes if file was loaded from saved files
            }

            // Clear existing timeout
            if (notesAutoSaveTimeout) {
                clearTimeout(notesAutoSaveTimeout);
            }

            // Debounce: wait 500ms after last change before saving
            notesAutoSaveTimeout = setTimeout(async () => {
                await performNotesAutoSave();
            }, 500);
        }

        async function performNotesAutoSave() {
            if (!currentSavedFilename) {
                return;
            }

            const indicator = document.getElementById('notesAutoSaveIndicator');
            const textarea = document.getElementById('notesTextarea');
            indicator.textContent = 'Saving...';
            indicator.style.display = 'inline-block';

            try {
                const response = await fetch(`api/notes/${encodeURIComponent(currentSavedFilename)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ notes: textarea.value })
                });

                const data = await response.json();

                if (data.success) {
                    indicator.textContent = 'Saved';
                    setTimeout(() => {
                        indicator.style.display = 'none';
                    }, 2000);
                } else {
                    indicator.textContent = 'Save failed';
                    console.error('Notes auto-save failed:', data.error);
                    setTimeout(() => {
                        indicator.style.display = 'none';
                    }, 3000);
                }
            } catch (error) {
                console.error('Notes auto-save error:', error);
                indicator.textContent = 'Save failed';
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 3000);
            }
        }

        async function loadNotes(filename) {
            const notesContainer = document.getElementById('notesContainer');
            const textarea = document.getElementById('notesTextarea');

            try {
                const response = await fetch(`api/notes/${encodeURIComponent(filename)}`);
                const data = await response.json();

                if (data.success) {
                    textarea.value = data.notes || '';
                    notesContainer.style.display = 'block';
                } else {
                    textarea.value = '';
                    notesContainer.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                textarea.value = '';
                notesContainer.style.display = 'block';
            }
        }

        function hideNotes() {
            const notesContainer = document.getElementById('notesContainer');
            const textarea = document.getElementById('notesTextarea');
            notesContainer.style.display = 'none';
            textarea.value = '';
        }

        function processFile(file, filename) {
            // Check if this is a reload of the same file
            const isReload = (filename === currentFilename);

            // Save current UI state if reloading
            if (isReload && currentData.length > 0) {
                savedUIState = saveUIState();
            } else {
                savedUIState = null;
            }

            editingHeaderIndex = null;
            originalHeaderName = null;
            pendingHeaderName = '';

            // Reset column types and selected rows if not reloading
            if (!isReload) {
                columnTypes = {};
                selectedRowIDs.clear();
                lastSelectedRowIndex = null;
            }

            // Update current filename
            currentFilename = filename;

            // Update filename display
            const filenameElement = document.getElementById('currentFilename');
            if (filename) {
                filenameElement.textContent = filename;
            }

            // Hide all action buttons while processing
            document.getElementById('addHeaderBtn').style.display = 'none';
            document.getElementById('addRowBtn').style.display = 'none';
            document.getElementById('addColumnBtn').style.display = 'none';
            document.getElementById('deleteBtn').style.display = 'none';

            // Show loading indicator
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('loadingIndicator').style.display = 'block';

            const fileSize = (file.size / 1024 / 1024).toFixed(1); // Size in MB
            document.getElementById('loadingDetails').textContent = `Reading ${fileSize}MB file...`;

            let rowCount = 0;
            let lastUpdate = Date.now();
            let allChunks = []; // Accumulate chunks here

            Papa.parse(file, {
                header: false,
                dynamicTyping: false,
                skipEmptyLines: true,
                chunk: function(results, parser) {
                    // Accumulate data from chunks
                    if (results && results.data) {
                        allChunks.push(...results.data);
                        rowCount += results.data.length;
                    }

                    // Update UI every 200ms to avoid too many updates
                    const now = Date.now();
                    if (now - lastUpdate > 200) {
                        const rowsFormatted = rowCount >= 1000
                            ? `${(rowCount / 1000).toFixed(1)}K`
                            : rowCount;
                        document.getElementById('loadingDetails').textContent =
                            `Parsed ${rowsFormatted} rows from ${fileSize}MB file...`;
                        lastUpdate = now;
                    }
                },
                complete: function (results) {
                    // Log results for debugging
                    console.log('Parse complete. Chunks collected:', allChunks.length);

                    // Use accumulated chunks instead of results.data
                    const data = allChunks;

                    // Check if we have any data
                    if (!data || data.length === 0) {
                        console.error('No data was parsed from the file');
                        document.getElementById('loadingIndicator').style.display = 'none';
                        document.getElementById('uploadSection').style.display = 'block';
                        alert("The file appears to be empty or could not be parsed.");
                        return;
                    }

                    // Log any parsing errors but continue
                    if (results && results.errors && results.errors.length > 0) {
                        console.warn(`Parsing completed with ${results.errors.length} errors:`, results.errors);
                    }

                    const totalRows = data.length;
                    const rowsFormatted = totalRows >= 1000
                        ? `${(totalRows / 1000).toFixed(1)}K`
                        : totalRows;

                    document.getElementById('loadingDetails').textContent =
                        `Processing ${rowsFormatted} rows...`;

                    // Ensure there's data in the file
                    if (data.length === 0) {
                        document.getElementById('loadingIndicator').style.display = 'none';
                        document.getElementById('uploadSection').style.display = 'block';
                        alert("The file is empty.");
                        return;
                    }

                    // Store raw data for later header manipulation
                    rawFileData = data;
                    hasCustomHeaders = false;

                    // Always use first row as headers by default
                    const firstRow = data[0];
                    currentHeaders = firstRow;
                    currentData = data.slice(1);

                    const dataRowsFormatted = currentData.length >= 1000
                        ? `${(currentData.length / 1000).toFixed(1)}K`
                        : currentData.length;

                    document.getElementById('loadingDetails').textContent =
                        `Mapping ${dataRowsFormatted} rows to columns...`;

                    // Use setTimeout to allow UI update before heavy processing
                    setTimeout(() => {
                        // Check if there's a "Checked" or "Rank" column in the headers
                        const checkedColumnIndex = currentHeaders.indexOf('Checked');
                        const rankColumnIndex = currentHeaders.indexOf('Rank');
                        const hasCheckedColumn = checkedColumnIndex !== -1;
                        const hasRankColumn = rankColumnIndex !== -1;

                        // Map the remaining rows to the headers, and add a unique ID
                        currentData = currentData.map((row, index) => {
                            const mappedRow = { ID: index + 1 };
                            currentHeaders.forEach((header, i) => {
                                mappedRow[header] = row[i] !== undefined ? row[i] : '';
                            });
                            return mappedRow;
                        });

                        // If there's a "Checked" column, restore checkbox states
                        if (hasCheckedColumn) {
                            checkedRows.clear();
                            currentData.forEach(row => {
                                const checkedValue = String(row['Checked']).toUpperCase();
                                if (checkedValue === 'TRUE' || checkedValue === '1' || checkedValue === 'YES') {
                                    checkedRows.add(row.ID);
                                }
                            });

                            // Remove "Checked" from headers (it's UI state, not data)
                            currentHeaders = currentHeaders.filter(h => h !== 'Checked');

                            // Remove "Checked" column from data
                            currentData = currentData.map(row => {
                                const newRow = { ...row };
                                delete newRow['Checked'];
                                return newRow;
                            });

                            // Enable checkbox column
                            showCheckboxColumn = true;
                            // Show bulk actions container
                            document.getElementById('bulkActionsContainer').style.display = 'flex';
                            // Mark checkmark button as active
                            document.getElementById('toggleCheckmarkColumnLink').classList.add('active');
                        } else if (!isReload) {
                            // No "Checked" column and not a reload - clear checked rows and reset checkbox column
                            checkedRows.clear();
                            showCheckboxColumn = false;
                            // Hide bulk actions container
                            document.getElementById('bulkActionsContainer').style.display = 'none';
                            // Mark checkmark button as inactive
                            document.getElementById('toggleCheckmarkColumnLink').classList.remove('active');
                        }

                        // If there's a "Rank" column, remove it and enable rank column
                        if (hasRankColumn) {
                            // Remove "Rank" from headers (it's UI state, not data)
                            currentHeaders = currentHeaders.filter(h => h !== 'Rank');

                            // Remove "Rank" column from data
                            currentData = currentData.map(row => {
                                const newRow = { ...row };
                                delete newRow['Rank'];
                                return newRow;
                            });

                            // Enable rank column
                            showRankColumn = true;
                        } else if (!isReload) {
                            // No "Rank" column and not a reload - reset rank column
                            showRankColumn = false;
                        }

                        allData = [...currentData];

                        // Auto-detect checkbox columns (only if not reloading with saved state)
                        if (!isReload || !savedUIState || !savedUIState.columnTypes) {
                            currentHeaders.forEach(header => {
                                // Check if all non-empty values in this column are TRUE/FALSE
                                const values = currentData.map(row => String(row[header]).toUpperCase().trim()).filter(v => v !== '');
                                if (values.length > 0) {
                                    const allBooleans = values.every(v => v === 'TRUE' || v === 'FALSE' || v === '1' || v === '0');
                                    if (allBooleans) {
                                        columnTypes[header] = 'checkbox';
                                    }
                                }
                            });
                        }

                        document.getElementById('loadingDetails').textContent =
                            `Rendering ${dataRowsFormatted} rows...`;

                        // Use setTimeout to allow UI to update before rendering
                        setTimeout(() => {
                            // Restore UI state if this is a reload
                            restoreUIState(savedUIState, isReload);

                            // Hide loading and show table
                            document.getElementById('loadingIndicator').style.display = 'none';
                            document.getElementById('tableContainer').style.display = 'block';
                            document.getElementById('optionsContainer').style.display = 'flex';

                            // Show action buttons whenever data is loaded
                            document.getElementById('deleteBtn').style.display = 'block';
                            document.getElementById('addRowBtn').style.display = 'block';
                            document.getElementById('addColumnBtn').style.display = 'block';

                            // Show add header button if using default headers
                            if (!hasCustomHeaders) {
                                document.getElementById('addHeaderBtn').style.display = 'block';
                            }

                            // Only clear filter input and state if NOT reloading
                            if (!isReload) {
                                document.getElementById('filterInput').value = '';
                                currentFilter = '';
                                unfilteredData = [];
                            }

                            // Update button states if they were automatically enabled (only on fresh load)
                            if (!isReload) {
                                if (showCheckboxColumn) {
                                    document.getElementById('toggleCheckmarkColumnLink').classList.add('active');
                                }
                                if (showRankColumn) {
                                    document.getElementById('toggleRankColumnLink').classList.add('active');
                                }
                            }

                            displayData(currentData);
                            updateUIVisibility(); // Ensure UI state is correct
                        }, 50);
                    }, 50);
                },
                error: function (error) {
                    console.error('Parsing Error:', error);
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('uploadSection').style.display = 'block';

                    let errorMsg = "An error occurred while parsing the file.";
                    if (error.message) {
                        errorMsg += `\n\nError: ${error.message}`;
                    }
                    if (error.row !== undefined) {
                        errorMsg += `\nRow: ${error.row}`;
                    }
                    errorMsg += "\n\nCheck the browser console for more details.";

                    alert(errorMsg);
                }
            });
        }

        function displayData(data) {
            if (editingCell && currentHeaders) {
                commitCellEdit();
            }
            if (!data || data.length === 0 || !currentHeaders) {
                console.error("No data or headers to display");
                return;
            }

            // Update row count display
            const rowCountElement = document.getElementById('rowCount');
            const formattedCount = data.length >= 1000
                ? `${(data.length / 1000).toFixed(1)}K`
                : data.length;
            rowCountElement.textContent = `${formattedCount} rows`;

            const tableHeader = document.querySelector('.table-header');
            const tableBody = document.querySelector('.table-body');

            // Create the header row with sorting functionality
            let headerRow = '<tr>';
            if (showDragHandle) headerRow += '<th style="width: 40px;">⠿</th>';
            if (showRankColumn) headerRow += '<th>Rank</th>';
            if (showCheckboxColumn) {
                let sortClass = 'sortable';
                if (currentSort.column === 'Checked') {
                    sortClass += currentSort.ascending ? ' sorted-asc' : ' sorted-desc';
                }
                headerRow += `<th class="${sortClass}" onclick="sortData('Checked')" style="cursor: pointer; user-select: none;" title="Click to sort by checked status">Check</th>`;
            }
            currentHeaders.forEach((header, index) => {
                let sortClass = 'sortable';
                if (currentSort.column === header) {
                    sortClass += currentSort.ascending ? ' sorted-asc' : ' sorted-desc';
                }
                const width = columnWidths[header] ? `style="width: ${columnWidths[header]}px;"` : '';
                const isEditing = editingHeaderIndex === index;
                const headerContent = isEditing
                    ? `<input id="headerEditInput"
                              class="header-edit-input"
                              value="${escapeHtml(pendingHeaderName || header)}"
                              oninput="handleHeaderInput(event)"
                              onkeydown="handleHeaderKeyDown(event)"
                              onblur="commitHeaderEdit()"
                              aria-label="Edit column name" />`
                    : `<span class="header-label"
                            draggable="true"
                            onclick="handleHeaderLabelClick(event, ${index})"
                            ondragstart="handleColumnDragStart(event, ${index})"
                            ondragend="handleColumnDragEnd(event)"
                            ondblclick="startHeaderEdit(${index}); event.stopPropagation();"
                            title="Click to sort • Double-click to rename • Drag to reorder">${escapeHtml(header)}</span>`;

                headerRow += `<th class="${sortClass} resizable-header" ${width} data-column="${header}" data-header-index="${index}">
                    <div class="header-cell">
                        ${headerContent}
                        <div class="resize-handle" data-column="${header}"></div>
                    </div>
                </th>`;
            });
            headerRow += '</tr>';
            tableHeader.innerHTML = headerRow;

            // Attach resize event listeners
            attachResizeListeners();
            attachColumnDragListeners();

            // Create the data rows with drag-and-drop functionality
            // Use array join instead of innerHTML concatenation for better performance
            const rows = data.map((row, rowIndex) => {
                const isSelected = selectedRowIDs.has(row.ID) ? ' selected-row' : '';
                let dataRow = `<tr class="${isSelected}" data-row-id="${row.ID}" onclick="handleRowClick(${row.ID}, ${rowIndex}, event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${rowIndex})">`;

                if (showDragHandle) {
                    dataRow += `<td class="drag-handle" draggable="true" ondragstart="handleDragStart(event, ${rowIndex})" style="cursor: grab; text-align: center;">⠿</td>`;
                }
                if (showRankColumn) dataRow += `<td>${rowIndex + 1}</td>`;
                if (showCheckboxColumn) {
                    const isChecked = checkedRows.has(row.ID) ? 'checked' : '';
                    dataRow += `<td><input type="checkbox" ${isChecked} data-row-id="${row.ID}" data-row-index="${rowIndex}" onclick="handleCheckboxChange(${row.ID}, ${rowIndex}, this, event)"></td>`;
                }
                currentHeaders.forEach((header, headerIndex) => {
                    const cellValue = row[header];

                    // Check if this is a checkbox column
                    if (columnTypes[header] === 'checkbox') {
                        const isChecked = (String(cellValue).toUpperCase() === 'TRUE' || cellValue === '1' || cellValue === 1) ? 'checked' : '';
                        dataRow += `<td><input type="checkbox" ${isChecked} onchange="handleCustomCheckboxChangeByIndex(${row.ID}, ${headerIndex}, this)"></td>`;
                    } else if (columnTypes[header] === 'number') {
                        const numericValue = cellValue !== null && cellValue !== undefined ? cellValue : '';
                        dataRow += `<td><input type="number" class="number-input" value="${escapeHtml(numericValue)}" step="any" inputmode="decimal" oninput="handleNumberInputChange(${row.ID}, ${headerIndex}, this)"></td>`;
                    } else {
                        const formattedValue = makeLinksClickable(cellValue);
                        dataRow += `<td class="text-cell" data-row-id="${row.ID}" data-header-index="${headerIndex}" onclick="startCellEdit(${row.ID}, ${headerIndex}, event)">${formattedValue}</td>`;
                    }
                });
                dataRow += '</tr>';
                return dataRow;
            });

            tableBody.innerHTML = rows.join('');

            // Update the checked rows button text to reflect current count
            if (showCheckboxColumn) {
                updateCheckedRowsButtonText();
            }
        }

        function makeLinksClickable(text) {
            if (text === null || text === undefined || text === '') return '';

            const textStr = String(text);
            // Quick check: if no http in the string, skip regex
            if (!textStr.includes('http://') && !textStr.includes('https://')) {
                return textStr;
            }

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return textStr.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function updateUIVisibility() {
            // Show bulk actions container and checkbox-related buttons only when checkboxes are enabled
            const bulkActionsContainer = document.getElementById('bulkActionsContainer');
            const showCheckedRowsLink = document.getElementById('showCheckedRowsLink');
            const checkAllNoneLink = document.getElementById('checkAllNoneLink');
            const deleteCheckedLink = document.getElementById('deleteCheckedLink');

            if (showCheckboxColumn) {
                // Show the entire bulk actions row
                bulkActionsContainer.style.display = 'flex';

                // Show individual checkbox-related buttons
                showCheckedRowsLink.style.display = 'inline-block';
                checkAllNoneLink.style.display = 'inline-block';
                deleteCheckedLink.style.display = 'inline-block';

                // Update Check All/None button text based on current state
                const allVisibleChecked = currentData.length > 0 && currentData.every(row => checkedRows.has(row.ID));
                checkAllNoneLink.textContent = allVisibleChecked ? 'Check None' : 'Check All';
            } else {
                // Hide the entire bulk actions row
                bulkActionsContainer.style.display = 'none';

                // Hide individual checkbox-related buttons
                showCheckedRowsLink.style.display = 'none';
                checkAllNoneLink.style.display = 'none';
                deleteCheckedLink.style.display = 'none';
            }

            // Show save button only when file is from saved files
            const saveLink = document.getElementById('saveLink');
            if (currentSavedFilename) {
                saveLink.style.display = 'inline-block';
            } else {
                saveLink.style.display = 'none';
            }

            // Show export button only when significant adjustments have been made
            const exportLink = document.getElementById('exportCSVLink');
            if (hasSignificantAdjustments) {
                exportLink.style.display = 'inline-block';
            } else {
                exportLink.style.display = 'none';
            }

            // Show "Show All" button when viewing filtered data
            const showAllLink = document.getElementById('showAllLink');
            if (showCheckedRows || currentFilter !== '') {
                showAllLink.style.display = 'inline-block';
            } else {
                showAllLink.style.display = 'none';
            }

            // Update the checked rows button text with count
            updateCheckedRowsButtonText();
        }

        function updateCheckedRowsButtonText() {
            const showCheckedRowsLink = document.getElementById('showCheckedRowsLink');
            const count = checkedRows.size;

            if (showCheckedRows) {
                showCheckedRowsLink.textContent = `Showing ${count} Check${count === 1 ? '' : 's'}`;
            } else {
                if (count > 0) {
                    showCheckedRowsLink.textContent = `Show ${count} Check${count === 1 ? '' : 's'}`;
                } else {
                    showCheckedRowsLink.textContent = 'Show Checks';
                }
            }
        }

        function updateRowCount() {
            const rowCountElement = document.getElementById('rowCount');
            const formattedCount = currentData.length >= 1000
                ? `${(currentData.length / 1000).toFixed(1)}K`
                : currentData.length;
            rowCountElement.textContent = `${formattedCount} rows`;
        }

        function sortDataByHeaderIndex(index) {
            const header = currentHeaders?.[index];
            if (!header) return;
            sortData(header);
        }

        function startHeaderEdit(index) {
            editingHeaderIndex = index;
            originalHeaderName = currentHeaders[index];
            pendingHeaderName = currentHeaders[index];
            displayData(currentData);
            // Defer focus until after render
            setTimeout(() => {
                const input = document.getElementById('headerEditInput');
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 0);
        }

        function handleHeaderInput(event) {
            pendingHeaderName = event.target.value;
        }

        function handleHeaderKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                commitHeaderEdit();
            } else if (event.key === 'Escape') {
                event.preventDefault();
                cancelHeaderEdit();
            }
        }

        function renameColumns(oldName, newName) {
            const renameRow = (row) => {
                const newRow = { ...row };
                newRow[newName] = newRow[oldName];
                delete newRow[oldName];
                return newRow;
            };

            currentData = currentData.map(renameRow);
            allData = allData.map(renameRow);

            if (unfilteredData.length > 0) {
                unfilteredData = unfilteredData.map(renameRow);
            }

            if (columnWidths[oldName]) {
                columnWidths[newName] = columnWidths[oldName];
                delete columnWidths[oldName];
            }

            if (columnTypes[oldName]) {
                columnTypes[newName] = columnTypes[oldName];
                delete columnTypes[oldName];
            }

            if (currentSort.column === oldName) {
                currentSort.column = newName;
            }
        }

        function commitHeaderEdit() {
            if (editingHeaderIndex === null) return;

            const newName = (pendingHeaderName || '').trim();
            const oldName = originalHeaderName;
            const headerIndex = editingHeaderIndex;

            editingHeaderIndex = null;
            originalHeaderName = null;
            pendingHeaderName = '';

            // If unchanged or empty, just re-render
            if (!newName || newName === oldName) {
                displayData(currentData);
                return;
            }

            // Prevent duplicate header names
            const duplicateIndex = currentHeaders.findIndex((h, idx) => idx !== headerIndex && h === newName);
            if (duplicateIndex !== -1) {
                alert('A column with that name already exists. Please choose another.');
                displayData(currentData);
                return;
            }

            currentHeaders[headerIndex] = newName;
            renameColumns(oldName, newName);

            hasCustomHeaders = true;
            markAsAdjusted();
            displayData(currentData);
            triggerAutoSave();
        }

        function cancelHeaderEdit() {
            editingHeaderIndex = null;
            originalHeaderName = null;
            pendingHeaderName = '';
            displayData(currentData);
        }

        function markAsAdjusted() {
            hasSignificantAdjustments = true;
            updateUIVisibility();
        }

        function toggleRankColumn() {
            showRankColumn = !showRankColumn;
            document.getElementById('toggleRankColumnLink').classList.toggle('active', showRankColumn);
            if (showRankColumn) {
                markAsAdjusted();
            } else {
                // Still update visibility when toggling off
                updateUIVisibility();
            }
            displayData(currentData);
        }

        function toggleCheckmarkColumn() {
            showCheckboxColumn = !showCheckboxColumn;
            document.getElementById('toggleCheckmarkColumnLink').classList.toggle('active', showCheckboxColumn);

            // Show/hide the bulk actions container
            const bulkActionsContainer = document.getElementById('bulkActionsContainer');
            if (showCheckboxColumn) {
                bulkActionsContainer.style.display = 'flex';
                markAsAdjusted();
            } else {
                bulkActionsContainer.style.display = 'none';
            }

            updateUIVisibility();
            displayData(currentData);
        }

        function toggleDragHandle() {
            showDragHandle = !showDragHandle;
            document.getElementById('toggleDragHandleLink').classList.toggle('active', showDragHandle);
            displayData(currentData);
        }

        function handleCustomCheckboxChangeByIndex(rowID, headerIndex, checkboxElem) {
            const columnName = currentHeaders[headerIndex];
            if (!columnName) return;

            // Update the value in the data
            const newValue = checkboxElem.checked ? 'TRUE' : 'FALSE';

            // Find and update the row in currentData
            const currentRow = currentData.find(row => row.ID === rowID);
            if (currentRow) {
                currentRow[columnName] = newValue;
            }

            // Find and update the row in allData
            const allRow = allData.find(row => row.ID === rowID);
            if (allRow) {
                allRow[columnName] = newValue;
            }

            // Update unfiltered data if it exists
            if (unfilteredData.length > 0) {
                const unfilteredRow = unfilteredData.find(row => row.ID === rowID);
                if (unfilteredRow) {
                    unfilteredRow[columnName] = newValue;
                }
            }

            markAsAdjusted();
            triggerAutoSave();
        }

        function handleNumberInputChange(rowID, headerIndex, inputElem) {
            const columnName = currentHeaders[headerIndex];
            if (!columnName) return;

            const newValue = inputElem.value;

            const updateRowValue = (row) => {
                if (row) {
                    row[columnName] = newValue;
                }
            };

            updateRowValue(currentData.find(row => row.ID === rowID));
            updateRowValue(allData.find(row => row.ID === rowID));

            if (unfilteredData.length > 0) {
                updateRowValue(unfilteredData.find(row => row.ID === rowID));
            }

            markAsAdjusted();
            triggerAutoSave();
        }

        function isTextColumn(header) {
            const columnType = columnTypes[header];
            return !columnType || columnType === 'text';
        }

        function getEditableHeaderIndexes() {
            const indexes = [];
            currentHeaders.forEach((header, index) => {
                if (isTextColumn(header)) {
                    indexes.push(index);
                }
            });
            return indexes;
        }

        function getTextCellElement(rowID, headerIndex) {
            return document.querySelector(`td.text-cell[data-row-id="${rowID}"][data-header-index="${headerIndex}"]`);
        }

        function startCellEdit(rowID, headerIndex, event) {
            if (event) {
                const target = event.target;
                if (target && (target.tagName === 'A' || (target.closest && target.closest('a')))) {
                    return;
                }
                event.stopPropagation();
            }

            const columnName = currentHeaders[headerIndex];
            if (!columnName || !isTextColumn(columnName)) return;

            const cell = event?.currentTarget || getTextCellElement(rowID, headerIndex);
            if (!cell) return;

            startCellEditByCell(rowID, headerIndex, cell);
        }

        function startCellEditByCell(rowID, headerIndex, cell) {
            if (editingCell && editingCell.rowID === rowID && editingCell.headerIndex === headerIndex) {
                return;
            }

            if (editingCell) {
                commitCellEdit();
            }

            const columnName = currentHeaders[headerIndex];
            if (!columnName || !isTextColumn(columnName)) return;

            const row = currentData.find(row => row.ID === rowID);
            const rawValue = row && row[columnName] !== undefined && row[columnName] !== null
                ? String(row[columnName])
                : '';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'text-input';
            input.value = rawValue;
            input.setAttribute('aria-label', `Edit ${columnName}`);
            input.onkeydown = handleTextInputKeyDown;
            input.onblur = () => commitCellEdit();

            cell.innerHTML = '';
            cell.appendChild(input);
            input.focus();
            input.select();

            editingCell = {
                rowID,
                headerIndex,
                cell,
                originalValue: rawValue
            };
        }

        function handleTextInputKeyDown(event) {
            if (!editingCell) return;

            if (event.key === 'Escape') {
                event.preventDefault();
                cancelCellEdit();
                return;
            }

            if (event.key === 'Enter') {
                event.preventDefault();
                const nextTarget = getVerticalEditableCell(editingCell.rowID, editingCell.headerIndex, event.shiftKey ? -1 : 1);
                commitCellEdit(nextTarget);
                return;
            }

            if (event.key === 'Tab') {
                event.preventDefault();
                const nextTarget = getNextEditableCell(editingCell.rowID, editingCell.headerIndex, event.shiftKey ? -1 : 1);
                commitCellEdit(nextTarget);
            }
        }

        function getNextEditableCell(rowID, headerIndex, direction) {
            const editableHeaderIndexes = getEditableHeaderIndexes();
            if (editableHeaderIndexes.length === 0) return null;

            const headerPosition = editableHeaderIndexes.indexOf(headerIndex);
            if (headerPosition === -1) return null;

            const rowIndex = currentData.findIndex(row => row.ID === rowID);
            if (rowIndex === -1) return null;

            let nextHeaderPosition = headerPosition + direction;
            let nextRowIndex = rowIndex;

            if (nextHeaderPosition >= editableHeaderIndexes.length) {
                nextHeaderPosition = 0;
                nextRowIndex += 1;
            } else if (nextHeaderPosition < 0) {
                nextHeaderPosition = editableHeaderIndexes.length - 1;
                nextRowIndex -= 1;
            }

            if (nextRowIndex < 0 || nextRowIndex >= currentData.length) return null;

            return {
                rowID: currentData[nextRowIndex].ID,
                headerIndex: editableHeaderIndexes[nextHeaderPosition]
            };
        }

        function getVerticalEditableCell(rowID, headerIndex, direction) {
            const rowIndex = currentData.findIndex(row => row.ID === rowID);
            if (rowIndex === -1) return null;

            const nextRowIndex = rowIndex + direction;
            if (nextRowIndex < 0 || nextRowIndex >= currentData.length) return null;

            return {
                rowID: currentData[nextRowIndex].ID,
                headerIndex
            };
        }

        function updateRowValueById(rowID, columnName, newValue) {
            const updateRowValue = (row) => {
                if (row) {
                    row[columnName] = newValue;
                }
            };

            updateRowValue(currentData.find(row => row.ID === rowID));
            updateRowValue(allData.find(row => row.ID === rowID));

            if (unfilteredData.length > 0) {
                updateRowValue(unfilteredData.find(row => row.ID === rowID));
            }
        }

        function commitCellEdit(nextTarget = null) {
            if (!editingCell) return;

            const { rowID, headerIndex, cell, originalValue } = editingCell;
            const columnName = currentHeaders[headerIndex];
            const input = cell.querySelector('input.text-input');
            const newValue = input ? input.value : originalValue;
            editingCell = null;

            if (columnName) {
                if (newValue !== originalValue) {
                    updateRowValueById(rowID, columnName, newValue);
                    markAsAdjusted();
                    triggerAutoSave();
                }
                cell.innerHTML = makeLinksClickable(newValue);
            }

            if (nextTarget) {
                const nextCell = getTextCellElement(nextTarget.rowID, nextTarget.headerIndex);
                if (nextCell) {
                    startCellEditByCell(nextTarget.rowID, nextTarget.headerIndex, nextCell);
                }
            }
        }

        function cancelCellEdit() {
            if (!editingCell) return;

            const { cell, originalValue } = editingCell;
            editingCell = null;
            cell.innerHTML = makeLinksClickable(originalValue);
        }

        function handleRowClick(rowID, rowIndex, event) {
            // Don't select row if clicking on a checkbox, input, or link
            const target = event.target;
            if (target.tagName === 'INPUT' || target.tagName === 'A' || target.closest('.drag-handle')) {
                return;
            }

            // Handle shift-click range selection
            if (event.shiftKey && lastSelectedRowIndex !== null && lastSelectedRowIndex !== rowIndex) {
                const start = Math.min(lastSelectedRowIndex, rowIndex);
                const end = Math.max(lastSelectedRowIndex, rowIndex);

                // Check if the clicked row is already selected to determine whether to select or deselect the range
                const shouldSelect = !selectedRowIDs.has(rowID);

                // Select or deselect all rows in the range
                for (let i = start; i <= end; i++) {
                    const currentRow = currentData[i];
                    if (currentRow) {
                        if (shouldSelect) {
                            selectedRowIDs.add(currentRow.ID);
                        } else {
                            selectedRowIDs.delete(currentRow.ID);
                        }
                    }
                }
            } else {
                // Normal single row toggle
                if (selectedRowIDs.has(rowID)) {
                    selectedRowIDs.delete(rowID); // Deselect if clicking the same row
                } else {
                    selectedRowIDs.add(rowID); // Select new row
                }
            }

            lastSelectedRowIndex = rowIndex;

            // Re-render to show selection
            displayData(currentData);
        }

        function handleCheckboxChange(rowID, rowIndex, checkboxElem, event) {
            // Ensure rowID is a number to match how IDs are stored in the data
            rowID = Number(rowID);
            // Handle shift-click range selection
            if (event.shiftKey && lastCheckedIndex !== null && lastCheckedIndex !== rowIndex) {
                const start = Math.min(lastCheckedIndex, rowIndex);
                const end = Math.max(lastCheckedIndex, rowIndex);

                // Determine if we're checking or unchecking based on current checkbox state
                const shouldCheck = checkboxElem.checked;

                // Check or uncheck all rows in the range
                for (let i = start; i <= end; i++) {
                    const currentRow = currentData[i];
                    if (currentRow) {
                        if (shouldCheck) {
                            checkedRows.add(currentRow.ID);
                        } else {
                            checkedRows.delete(currentRow.ID);
                        }
                    }
                }

                // Refresh the display to show all checked boxes
                displayData(currentData);
                updateUIVisibility();
            } else {
                // Normal single checkbox toggle
                if (checkboxElem.checked) {
                    checkedRows.add(rowID);
                    // Update button text immediately
                    updateUIVisibility();
                } else {
                    checkedRows.delete(rowID);

                    // If we're in "Show Checks" mode and unchecking, remove the row visually
                    if (showCheckedRows) {
                        // Find and remove the table row from DOM
                        const tableRow = checkboxElem.closest('tr');
                        if (tableRow) {
                            tableRow.remove();
                            // Update currentData array to match
                            currentData = currentData.filter(row => row.ID !== rowID);
                            // Update counters AFTER removing from checkedRows and currentData
                            updateUIVisibility();
                            updateRowCount();
                        }
                    } else {
                        // Not in "Show Checks" mode, just update button text
                        updateUIVisibility();
                    }
                }
            }

            lastCheckedIndex = rowIndex;
            triggerAutoSave();
        }

        function toggleCheckAllNone() {
            // Check if all visible rows are checked
            const allVisibleChecked = currentData.every(row => checkedRows.has(row.ID));

            if (allVisibleChecked) {
                // Uncheck all visible rows
                currentData.forEach(row => {
                    checkedRows.delete(row.ID);
                });
            } else {
                // Check all visible rows
                currentData.forEach(row => {
                    checkedRows.add(row.ID);
                });
            }

            displayData(currentData);
            updateUIVisibility();
            triggerAutoSave();
        }

        function checkAll() {
            currentData.forEach(row => {
                checkedRows.add(row.ID);
            });
            displayData(currentData);
            updateUIVisibility();
            triggerAutoSave();
        }

        function checkNone() {
            checkedRows.clear();
            displayData(currentData);
            updateUIVisibility();
            triggerAutoSave();
        }

        function deleteCheckedRows() {
            if (checkedRows.size === 0) {
                alert('No rows are checked');
                return;
            }

            const count = checkedRows.size;
            if (!confirm(`Are you sure you want to delete ${count} checked row${count === 1 ? '' : 's'}? This cannot be undone.`)) {
                return;
            }

            // Remove checked rows from both currentData and allData
            currentData = currentData.filter(row => !checkedRows.has(row.ID));
            allData = allData.filter(row => !checkedRows.has(row.ID));

            // Reassign IDs to maintain sequential numbering
            currentData = currentData.map((row, index) => ({
                ...row,
                ID: index + 1
            }));
            allData = allData.map((row, index) => ({
                ...row,
                ID: index + 1
            }));

            // Clear checked rows since they've been deleted
            checkedRows.clear();

            // If we were in "Show Checks" mode, exit it since there are no more checked rows
            if (showCheckedRows) {
                showCheckedRows = false;
                document.getElementById('showCheckedRowsLink').classList.remove('active');
            }

            // Mark as adjusted and trigger auto-save
            markAsAdjusted();
            displayData(currentData);
            updateCheckedRowsButtonText();
            updateUIVisibility();
            triggerAutoSave();
        }

        // Column resizing functionality
        function attachResizeListeners() {
            const resizeHandles = document.querySelectorAll('.resize-handle');

            resizeHandles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    isResizing = true;
                    currentResizeColumn = handle.getAttribute('data-column');
                    startX = e.pageX;

                    const th = handle.closest('th');
                    startWidth = th.offsetWidth;

                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                });
            });
        }

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            const diff = e.pageX - startX;
            const newWidth = Math.max(50, startWidth + diff); // Minimum width of 50px

            columnWidths[currentResizeColumn] = newWidth;

            // Update the column width immediately
            const th = document.querySelector(`th[data-column="${currentResizeColumn}"]`);
            if (th) {
                th.style.width = newWidth + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                currentResizeColumn = null;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
    });

        // Column reordering functionality
        function attachColumnDragListeners() {
            const headerCells = document.querySelectorAll('.table-header th.resizable-header');

            headerCells.forEach((th) => {
                th.addEventListener('dragover', handleColumnDragOver);
                th.addEventListener('dragleave', handleColumnDragLeave);
                th.addEventListener('drop', handleColumnDrop);
            });
        }

        function handleColumnDragStart(event, index) {
            draggedHeaderIndex = index;
            isColumnDragging = true;
            columnDragJustEnded = false;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(index));
            event.stopPropagation();

            const th = event.target.closest('th');
            if (th) {
                th.classList.add('dragging-column');
            }
        }

        function handleColumnDragEnd(event) {
            const th = event.target.closest('th');
            if (th) {
                th.classList.remove('dragging-column');
            }
            clearColumnDropTargets();
            setTimeout(() => {
                columnDragJustEnded = false;
            }, 0);
            isColumnDragging = false;
            draggedHeaderIndex = null;
        }

        function handleColumnDragOver(event) {
            if (draggedHeaderIndex === null) return;
            event.preventDefault();

            const th = event.currentTarget;
            th.classList.add('column-drop-target');
        }

        function handleColumnDragLeave(event) {
            const th = event.currentTarget;
            th.classList.remove('column-drop-target');
        }

        function handleColumnDrop(event) {
            if (draggedHeaderIndex === null) return;
            event.preventDefault();

            const targetIndex = parseInt(event.currentTarget.getAttribute('data-header-index'), 10);
            if (Number.isNaN(targetIndex)) {
                clearColumnDropTargets();
                return;
            }

            if (targetIndex === draggedHeaderIndex) {
                clearColumnDropTargets();
                return;
            }

            reorderColumns(draggedHeaderIndex, targetIndex);
        }

        function clearColumnDropTargets() {
            const headers = document.querySelectorAll('.table-header th');
            headers.forEach(th => {
                th.classList.remove('column-drop-target');
                th.classList.remove('dragging-column');
            });
        }

        function reorderColumns(fromIndex, toIndex) {
            if (fromIndex < 0 || toIndex < 0 || fromIndex >= currentHeaders.length || toIndex >= currentHeaders.length) {
                clearColumnDropTargets();
                return;
            }

            const [moved] = currentHeaders.splice(fromIndex, 1);
            currentHeaders.splice(toIndex, 0, moved);

            clearColumnDropTargets();
            draggedHeaderIndex = null;
            markAsAdjusted();
            displayData(currentData);
            triggerAutoSave();
        }

        function handleHeaderLabelClick(event, index) {
            if (isColumnDragging || columnDragJustEnded) {
                event.preventDefault();
                return;
            }
            sortDataByHeaderIndex(index);
        }

        function toggleCheckedRows() {
            showCheckedRows = !showCheckedRows;

            if (showCheckedRows) {
                // Only display rows that are checked
                currentData = allData.filter(row => checkedRows.has(row.ID));
                displayData(currentData);
                markAsAdjusted();
            } else {
                // Show all rows again
                currentData = [...allData];
                displayData(currentData);
            }

            document.getElementById('showCheckedRowsLink').classList.toggle('active', showCheckedRows);
            updateCheckedRowsButtonText();
            updateUIVisibility();
        }

        function showAllRows() {
            // Reset checked rows filter
            if (showCheckedRows) {
                showCheckedRows = false;
                document.getElementById('showCheckedRowsLink').classList.remove('active');
                updateCheckedRowsButtonText();
            }

            // Reset search filter
            if (currentFilter !== '') {
                document.getElementById('filterInput').value = '';
                currentFilter = '';
            }

            // Restore all data
            if (unfilteredData.length > 0) {
                currentData = [...unfilteredData];
                unfilteredData = [];
            } else {
                currentData = [...allData];
            }

            displayData(currentData);
            updateUIVisibility();
        }

        // Filter rows based on search term
        function filterRows() {
            const filterInput = document.getElementById('filterInput');
            const filterText = filterInput.value.toLowerCase().trim();

            // If filter is empty, restore unfiltered data
            if (filterText === '') {
                if (currentFilter !== '') {
                    // Was filtering before, now clearing
                    currentData = [...allData];
                    currentFilter = '';
                    unfilteredData = [];
                    displayData(currentData);
                    updateUIVisibility();
                }
                return;
            }

            // Store unfiltered data if this is the first filter
            if (currentFilter === '') {
                unfilteredData = [...allData];
            }

            // Filter data - search across all columns (always filter from allData to ensure we have complete dataset)
            const filtered = allData.filter(row => {
                // Check each column value
                return currentHeaders.some(header => {
                    const value = row[header];
                    if (value === null || value === undefined) return false;
                    return String(value).toLowerCase().includes(filterText);
                });
            });

            currentFilter = filterText;
            currentData = filtered;
            displayData(currentData);

            // DON'T trigger auto-save on filter - filtering is UI state, not data change
            // Remove this to prevent saving filtered data:
            // if (filterText !== '') {
            //     markAsAdjusted();
            // }

            updateUIVisibility();
        }

        function parseCSV(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    complete: (result) => {
                        console.log('Parsed Data:', result.data); // Debugging line
                        resolve(result.data);
                    },
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    error: (error) => {
                        console.error('Parsing Error:', error); // Error handling
                        reject(error);
                    },
                });
            });
        }

        // Drag-and-drop row reordering functionality
        function handleDragStart(event, index) {
            draggedRowIndex = index;
            event.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(event, index) {
            event.preventDefault();
            if (draggedRowIndex !== null && draggedRowIndex !== index) {
                const draggedRow = currentData.splice(draggedRowIndex, 1)[0];
                currentData.splice(index, 0, draggedRow);
                markAsAdjusted();
                displayData(currentData);
                triggerAutoSave();
            }
        }

        // Sorting functionality
        function sortData(column) {
            // Toggle sorting order if the same column is clicked again
            if (currentSort.column === column) {
                currentSort.ascending = !currentSort.ascending;
            } else {
                currentSort.column = column;
                currentSort.ascending = true;
            }

            // Sort function to be used for both arrays
            const sortFunction = (a, b) => {
                // Special handling for "Checked" column - sort by checkbox state
                if (column === 'Checked') {
                    const isAChecked = checkedRows.has(a.ID);
                    const isBChecked = checkedRows.has(b.ID);

                    if (isAChecked === isBChecked) return 0;
                    if (isAChecked && !isBChecked) return currentSort.ascending ? -1 : 1;
                    if (!isAChecked && isBChecked) return currentSort.ascending ? 1 : -1;
                    return 0;
                }

                const valA = a[column];
                const valB = b[column];

                return compareCellValues(valA, valB, currentSort.ascending);
            };

            // Sort both the current data and all data to maintain sort across filters
            currentData.sort(sortFunction);
            allData.sort(sortFunction);

            markAsAdjusted();

            // If showing only checked rows, re-filter after sorting
            if (showCheckedRows) {
                const filteredData = allData.filter(row => checkedRows.has(row.ID));
                displayData(filteredData);
            } else {
                displayData(currentData);
            }

            triggerAutoSave();
        }

        // Export CSV functionality
        function exportCSV() {
            if (!currentData || currentData.length === 0 || !currentHeaders) {
                alert("No data to export");
                return;
            }

            // Show export dialog
            showExportDialog();
        }

        function generateCSVContent(useFullData = false) {
            // Build CSV content
            let csvContent = '';

            // Add headers
            let headers = [];
            if (showRankColumn) {
                headers.push('Rank');
            }
            if (showCheckboxColumn) {
                headers.push('Checked');
            }
            headers = headers.concat(currentHeaders);
            csvContent += headers.map(h => `"${h}"`).join(',') + '\n';

            // Determine which data to export
            // When useFullData is true (auto-save), always use allData to preserve complete dataset
            // When exporting manually, use currentData which may be filtered
